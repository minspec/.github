name: term wall
description: >-
  Refuses names this organisation does not use — in tracked content, in
  file paths, in the change's commit messages, in the pull request title
  and body, and in the branch name. The wall never spells what it
  refuses and masks every hit it prints.
runs:
  using: composite
  steps:
    - name: term wall
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: bash "$GITHUB_ACTION_PATH/term-wall.sh"
